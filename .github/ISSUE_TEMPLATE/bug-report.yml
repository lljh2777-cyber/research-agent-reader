name: Bug report
description: Report a reproducible Research Agent Reader problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private note content, credentials, provider endpoints, and local paths before submitting.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version and installer version
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Affected feature
      options:
        - Markdown or Clippings reader
        - MinerU reader
        - Annotations
        - Built-in health check
        - Direct API query
        - Optional Research Vault Toolkit action
        - Settings or diagnostics
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
